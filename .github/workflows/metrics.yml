name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (Optional) Run workflow manually
  workflow_dispatch:
  # (Optional) Run on push to master
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Options
          user: your-github-username
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          
          # THE LUXURY TWEAKS
          # We use CSS to force the "Glass" look on the generated SVG
          extras_css: |
            /* Remove default backgrounds */
            .field { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 12px; }
            h1, h2, h3 { color: #ffffff !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important; }
            /* Hide the noise background if present */
            .background { display: none; }
            
          # Plugins (The "Widgets")
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 4
          
          # Generate separate files for the "Bento" layout
          filename: metrics.classic.svg
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://dev.to/feed/your-username"
          max_post_count: 3
          # Use the unicode font directly in the template for luxury feel
          template: "$newline - [$title]($url)"